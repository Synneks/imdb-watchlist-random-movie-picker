<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Watchlist Picker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>What to watch?</h1>
      <p id="status" class="status">Loading…</p>
    </header>

    <section class="panel settings">
      <label for="watchlist-source">IMDb watchlist or custom-list URL / ID</label>
      <input
        id="watchlist-source"
        type="text"
        placeholder="https://www.imdb.com/list/ls123456789/"
        autocomplete="off"
        spellcheck="false"
      />
      <label class="checkbox">
        <input id="movies-only" type="checkbox" />
        Movies &amp; TV movies only
      </label>
    </section>

    <main class="panel">
      <div id="result" class="result hidden">
        <div class="actions">
          <button id="pick-again" type="button" class="btn primary large">Pick again</button>
          <a id="open-imdb" class="btn secondary" href="#" target="_blank" rel="noopener">Open on IMDb</a>
        </div>
        <div class="result-top">
          <img id="poster" alt="" class="poster hidden" />
          <div class="result-body">
            <h2 id="title">—</h2>
            <p id="meta" class="meta"></p>
            <p id="rating-line" class="rating-line hidden"></p>
            <p id="credits" class="credits hidden"></p>
          </div>
        </div>
        <p id="plot" class="plot hidden"></p>
      </div>

      <div id="import-progress" class="import-progress hidden">
        <div class="spinner" aria-hidden="true"></div>
        <p id="import-message">Importing list…</p>
      </div>

      <div id="idle" class="idle">
        <button id="primary-action" type="button" class="btn primary large">Import list</button>
        <button id="refresh-list" type="button" class="btn link hidden">Refresh list</button>
      </div>
    </main>

    <p id="error" class="error hidden" role="alert"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
